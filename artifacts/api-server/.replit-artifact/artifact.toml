kind = "api"
previewPath = "/"
title = "Nyaya Bandhu"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8000
name = "API Server"
paths = ["/"]

[services.env]
PORT = "8000"

[services.development]
# The managed workflow starts in this artifact's directory.
run = "python serve.py"

[services.production]

[services.production.run]
# Works whether the process starts at the project root or in the artifact directory.
args = ["bash", "-c", "if [ -f serve.py ]; then exec python serve.py; else exec python artifacts/api-server/serve.py; fi"]

[services.production.run.env]
PORT = "8000"
APP_ENV = "production"

[services.production.health.startup]
path = "/healthz"
