[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Devshri", email = "67629885-devshri23d@users.noreply.replit.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "apscheduler>=3.11.3",
    "cryptography>=50.0.2",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "python-multipart>=0.0.33",
    "replit-object-storage>=1.0.2",
    "reportlab>=5.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.8",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["artifacts/api-server"]
